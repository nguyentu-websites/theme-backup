name: Snapshot source theme repository (one time)
on:
  push:
    branches: [main]
    paths: [.github/workflows/backup-theme-once.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    if: github.repository == 'nguyentu-websites/theme-backup'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Copy every source branch and tag into dated backup refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="https://github.com/thuexemayhanoi/theme.git"
          DEST="https://x-access-token:${GH_TOKEN}@github.com/nguyentu-websites/theme-backup.git"
          PREFIX="snapshots/2026-10-28"
          git clone --mirror "${SOURCE}" source.git
          BRANCHES=$(git --git-dir=source.git for-each-ref --format='%(refname)' refs/heads | wc -l)
          TAGS=$(git --git-dir=source.git for-each-ref --format='%(refname)' refs/tags | wc -l)
          SRC_MAIN=$(git --git-dir=source.git rev-parse refs/heads/main)
          test "${BRANCHES}" -gt 0
          git --git-dir=source.git push "${DEST}" "refs/heads/*:refs/heads/${PREFIX}/*"
          if test "${TAGS}" -gt 0; then
            git --git-dir=source.git push "${DEST}" "refs/tags/*:refs/tags/${PREFIX}/*"
          fi
          DST_MAIN=$(git ls-remote "${DEST}" "refs/heads/${PREFIX}/main" | cut -f1)
          DST_BRANCHES=$(git ls-remote --heads "${DEST}" "refs/heads/${PREFIX}/*" | wc -l)
          test "${SRC_MAIN}" = "${DST_MAIN}"
          test "${BRANCHES}" -eq "${DST_BRANCHES}"
          echo "Backup verified. Branches: ${DST_BRANCHES}; Tags: ${TAGS}; source main SHA: ${SRC_MAIN}"
